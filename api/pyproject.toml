[project]
name = "moo-api"
version = "0.1.0"
description = "moo search API — evidence-graph search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-genai>=2.11.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "sentence-transformers",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = false
