[project]
name = "moo-api"
version = "0.1.0"
description = "moo search API — evidence-graph search engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "google-genai>=2.11.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "sentence-transformers",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.1.0",
]

# `moo-mcp` MCP server entry point (SUP-118). Installable with
# `uv tool install .` / `pipx install .`; runs stdio by default, `--http` for
# streamable HTTP. Zero-install alternative: `uv run python -m app.mcp_server`.
[project.scripts]
moo-mcp = "app.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
