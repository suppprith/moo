name: sdk

on:
  push:
    paths:
      - "sdk/**"
      - "integrations/**"
      - "api/openapi.json"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "integrations/**"
      - "api/openapi.json"
      - ".github/workflows/sdk.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx pytest ruff
      - run: ruff check .
      - run: python -m pytest tests -q

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integrations-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install langchain-core llama-index-core httpx pytest ruff
      - run: ruff check .
        working-directory: integrations
      - run: python -m pytest tests -q
        working-directory: integrations/langchain-moo
      - run: python -m pytest tests -q
        working-directory: integrations/llamaindex-moo

  integrations-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vercel-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
