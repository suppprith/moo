# The docs site and playground had no CI, which matters more than usual here:
# the API reference page is generated from api/openapi.json at build time, so a
# spec change can break the site from a commit that never touches web/. That is
# why this runs on api/openapi.json as well as on web/.

name: web

on:
  push:
    paths:
      - "web/**"
      - "docs/**"
      - "api/openapi.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/**"
      - "api/openapi.json"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # Builds every docs page, including the generated API reference and the
      # markdown pages read out of docs/ — a doc that stops resolving fails here.
      - run: npm run build
