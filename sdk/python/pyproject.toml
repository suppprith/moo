[project]
name = "moo-search"
version = "0.1.0"
description = "Official Python SDK for moo: search infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["search", "agents", "llm", "rag", "web-search", "mcp"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/suppprith/moo"
Source = "https://github.com/suppprith/moo/tree/main/sdk/python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moo"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
