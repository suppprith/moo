[project]
name = "llama-index-tools-moo"
version = "0.1.0"
description = "moo retriever, reader and tool spec for LlamaIndex: live software search with claim-level evidence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llamaindex", "search", "agents", "rag", "retriever"]
dependencies = ["llama-index-core>=0.11", "moo>=0.1"]

[project.urls]
Homepage = "https://github.com/suppprith/moo"
Source = "https://github.com/suppprith/moo/tree/main/integrations/llamaindex-moo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama_index_moo"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
